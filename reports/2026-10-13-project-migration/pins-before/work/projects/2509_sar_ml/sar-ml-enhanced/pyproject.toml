[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@imt-atlantique.fr"}]
dependencies = []
description = "Machine learning on SAR data"
name = "sar-ml"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
sml-data-split = "sar_ml.stages.data:split_safes"
sml-data-extract = "sar_ml.stages.data:extract_features"
sml-data-prep-ds = "sar_ml.stages.data:prepare_dataset"

sml-model-train = "sar_ml.stages.train:run"
sml-model-save = "sar_ml.stages.save_model:save_model"
sml-model-predict = "sar_ml.stages.predict:predict"

sml-diag-maps = "sar_ml.stages.plot_listings:plot_listings"
sml-diag-scatter = "sar_ml.stages.scatter:scatter"
sml-diag-hiplot = "sar_ml.stages.plot_hiplot:plot_hiplot"
sml-diag-metrics = "sar_ml.stages.metrics:compute_metrics"

sml-mlflow-log = "sar_ml.stages.mlflow_log:mlflow_log"
sml-mlflow-log-data = "sar_ml.stages.mlflow_log:mlflow_log_data"
sml-mlflow-log-train = "sar_ml.stages.mlflow_log:mlflow_log_training"
sml-mlflow-log-diags = "sar_ml.stages.mlflow_log:mlflow_log_diags"
sml-mlflow-log-val = "sar_ml.stages.mlflow_log:mlflow_log_validation"

sml-collocate-obs = "sar_ml.stages.collocation:collocate_obs"
sml-collocate-model = "sar_ml.stages.collocation:collocate_model"
sml-concat-coloc = "sar_ml.stages.collocation:concatenate_coloc"
sml-postproc-coloc = "sar_ml.stages.collocation:postprocess_coloc"
sml-join-coloc = "sar_ml.stages.validate:join_coloc_features"
sml-predict-coloc = "sar_ml.stages.validate:predict_coloc"
sml-scatter-coloc = "sar_ml.stages.validate:scatter_coloc"

sml-ablation-hs-mlp = "sar_ml.pipelines.ablation_hs_mlp:run_hs_mlp"
sml-ablation-hs-mlp-all = "sar_ml.pipelines.ablation_hs_mlp:run_hs_mlp_all"
sml-ablation-hs-mlp-diags = "sar_ml.pipelines.ablation_hs_mlp:run_hs_mlp_diags"

sml-pipeline-data = "sar_ml.pipelines.data_pipeline:run_data_pipeline"
sml-pipeline-train = "sar_ml.pipelines.training_pipeline:run_training_pipeline"
sml-pipeline-phase3 = "sar_ml.pipelines.phase3_context_flow:run_phase3_pipeline"
sml-pipeline-diags = "sar_ml.pipelines.diags_pipeline:run_diags_pipeline"
sml-pipeline-val = "sar_ml.pipelines.validation_pipeline:run_validation_pipeline"
sml-pipeline-full-val = "sar_ml.pipelines.validation_pipeline:run_full_validation_pipeline"
sml-pipeline-colloc = "sar_ml.pipelines.validation_pipeline:run_colloc_pipeline"
sml-pipeline-validate-fast = "sar_ml.pipelines.validation_pipeline:run_validate_fast_pipeline"
sml-pipeline-finetune = "sar_ml.pipelines.phase3_finetune:run_phase3_finetune_pipeline"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["sar_ml"]

[tool.pixi.workspace]
authors = ["Quentin Febvre <quentin.febvre@imt-atlantique.fr>"]
channels = ["conda-forge", "quentinf00"]
description = "Machine learning on SAR data"
name = "sar_ml_xps"
platforms = [{platform = "linux-64", cuda= "13"}]
version = "0.1.0"


[tool.pixi.activation.env]
MLFLOW_PROJECT_NAME = "sar_ml"
MLFLOW_TRACKING_URI = "/scale/scratch/qfebvre/mlruns"

[tool.pixi.tasks]
fmt = "ruff format"

[tool.pixi.dependencies]
flexlock = "0.8.*"
mlflow = ">=2.20.1,<3"
dvc = ">=3.59.0,<4"
pytorch-gpu = "*"
lightning = ">=2.5.0.post0,<3"
einops = ">=0.8.0,<0.9"
xarray = ">=2025.1.2,<2026"
hvplot = ">=0.11.2,<0.12"
cartopy = ">=0.24.0,<0.25"
geopandas = ">=1.0.1,<2"
geoviews = ">=1.14.0,<2"
cachier = ">=3.1.2,<4"
h5netcdf = ">=1.5.0,<2"
toolz = ">=1.0.0,<2"
onnx = ">=1.17.0,<2"
hiplot = ">=0.1.33,<0.2"
onnxruntime = ">=1.20.1,<2"
contextily = ">=1.7.0,<2"
selenium = ">=4.38.0,<5"
pillow = ">=12.1.1,<13"
panel = ">=1.8.10,<2"
cmap = ">=0.7.1,<0.8"
cmocean = ">=4.0.3,<5"

[tool.pixi.pypi-dependencies]
sar-ml = { path = ".", editable = true }
sarwave-features = { path = "sarwave_features", editable = true }
sarwave-collocation = { path = "sarwave_collocation", editable = true }
mpl-scatter-density = ">=0.8, <0.9"
surface-wave-spectra = { path = "../lisa_code/spectra", editable = true }

[tool.pixi.feature.inference.pypi-dependencies]
sarwaveifrproc = { path = "sarwaveifrproc", editable = true }

[tool.pixi.feature.jupyter.activation.env]
BETTER_EXCEPTIONS = '1'
LOVELY_TENSORS = '1'

[tool.pixi.feature.jupyter.dependencies]
ipykernel = "*"
lovely-tensors = ">=0.1.18,<0.2"
lovely-numpy = ">=0.2.13,<0.3"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.9.3,<0.10"

[tool.pixi.environments]
jupyter = ["jupyter"]
lint = { features = ["lint"], no-default-feature = true }
inference = { features = ["inference"] }
