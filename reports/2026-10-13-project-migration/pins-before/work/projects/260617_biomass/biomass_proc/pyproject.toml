[project]
authors = [{name = "Sebastien Guimbard", email = "sebastien.guimbard@ocean-scope.com"}]
dependencies = []
name = "biomass-proc"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/biomass_proc"]

[tool.pixi.workspace]
channels = ["conda-forge", "quentinf00", "menpo"]
platforms = ["linux-64"]

# Editable installs of the building-block packages. The model-registry models
# (OceanSarEmbed, SarWave, ...) are NOT installed here — they are driven through
# mlflow_pixi.predict, which builds each model's own bundled pixi env.
[tool.pixi.pypi-dependencies]
biomass_proc = { path = ".", editable = true }
xsargrd = { path = "../xsar_grd", editable = true }
xsarslc = { path = "../xsar_slc", editable = true }
xsar = { path = "../../2507_galeio/xsar", editable = true }
grdtiler = { path = "../../2507_galeio/grdtiler", editable = true }
mlflow-pixi = { path = "../../260318_model_registry/mlflow_pixi", editable = true }
# Vendored fork with the terrainSlope-conflict fix (newer BIOMASS products split
# terrain slope into rangeTerrainSlope / azimuthTerrainSlope).
xarray-biomass = { path = "../../260318_model_registry/vendor/xarray-biomass", editable = false }
pywst = "*"

[tool.pixi.dependencies]
python = "3.11.*"
flexlock = "0.8.*"
mlflow = "3.13.*"
gdal = "3.12.1.*"
rasterio = "*"
xarray = "2025.12.*"
netcdf4 = "*"
h5netcdf = ">=1.8.1,<2"
numpy = "*"
scipy = "*"
shapely = ">=2.1.2,<3"
xrft = "*"
tqdm = "*"
pyyaml = "*"
importlib_resources = "*"
loguru = "*"
# Analysis / exploration app
streamlit = "*"
plotly = "*"
pyarrow = "*"
pillow = "*"
scikit-learn = "*"
umap-learn = "*"
# Lonboard acquisition explorer. Panel hosts Lonboard's AnyWidget without a
# custom frontend; async-geotiff/obstore provide optional local COG streaming.
panel = ">=1.8.10"
lonboard = ">=0.16"
ipywidgets = "*"
ipywidgets-bokeh = "*"
geopandas = "*"
async-geotiff = ">=0.4"
obstore = ">=0.9"
morecantile = "*"
# SAR readers pulled in transitively by grdtiler
xsarsea = "*"
xarray-safe-s1 = "*"

# Point MLflow at the model registry's SQLite store so that
# `models:/OceanSarEmbed@champion` resolves from this project.
[tool.pixi.activation.env]
MLFLOW_TRACKING_URI = "sqlite:////scale/user/qfebvre/projects/260318_model_registry/registry/mlruns.db"
MLFLOW_REGISTRY_URI = "sqlite:////scale/user/qfebvre/projects/260318_model_registry/registry/mlruns.db"
# Parallel workers read shared ancillary NetCDFs (ECMWF/WW3) concurrently on a
# network FS; HDF5's file locking then fails with "NetCDF: HDF error". Disable it
# (safe for concurrent read-only access). Inherited by the mlflow_pixi subprocess.
HDF5_USE_FILE_LOCKING = "FALSE"

[tool.pixi.tasks]
pipeline = "python pipeline.py"
explorer-build = "python analysis/build_explo_app_data.py"
explorer-serve = { cmd = "streamlit run ../biomass_explo_app/src/biomass_explo_app/app.py -- /scale/project/lops-siam-biomass/analysis/qfebvre/explo_app/s2_raw_v1/biomass_exploration_data.parquet", env = { PYTHONPATH = "../biomass_explo_app/src" } }
annotation-build = "python analysis/build_acquisition_annotation_data.py"
annotation-serve = "streamlit run analysis/acquisition_annotation_app.py -- /scale/project/lops-siam-biomass/analysis/qfebvre/explo_app/acquisition_annotation_v1"
acquisition-features = "python analysis/build_acquisition_features.py"
rfi-evaluate = "python analysis/evaluate_rfi_acquisition.py"
sea-ice-collocate = "python analysis/collocate_sea_ice.py"
