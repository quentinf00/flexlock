[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@imt-atlantique.fr"}]
dependencies = []
name = "hafs_tools"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hafs_tools = { path = ".", editable = true }
flexlock = { path = "../../2509_flexlock/flexlock", editable = true }

[tool.pixi.tasks]
estimate = "python -m hafs_tools.estimate"
extract-sample = "python -m hafs_tools.extract_sample"
download-winds = "python -m hafs_tools.download_winds"
download-sat = "python -m hafs_tools.download_sat"
download-atcf = "python -m hafs_tools.download_atcfunix"
download-ocean = "python -m hafs_tools.download_ocean"
download-mom6 = "python -m hafs_tools.download_mom6"
download-ww3 = "python -m hafs_tools.download_ww3"
preprocess-winds = "python -m hafs_tools.preprocess_winds"
preprocess-sat   = "python -m hafs_tools.preprocess_sat"
preprocess-winds-v2 = "python -m hafs_tools.preprocess_winds --img-size 256 --resolution-km 3.0"
preprocess-sat-v2   = "python -m hafs_tools.preprocess_sat   --img-size 256 --resolution-km 3.0"
master-sat    = "python -m hafs_tools.master_zarr sat"
master-wind   = "python -m hafs_tools.master_zarr wind"
master-splits = "python -m hafs_tools.master_zarr splits"
verify-master = "python -m hafs_tools.verify_master_zarr"
derive-slim-sat  = "python -m hafs_tools.derive_slim sat"
derive-slim-wind = "python -m hafs_tools.derive_slim wind"
benchmark-dataloader = "python -m hafs_tools.benchmark_dataloader"
convert-zarr = "python -m hafs_tools.convert_to_zip"
repair-stores = "python -m hafs_tools.repair_stores"
split-stores = "python -m hafs_tools.split_by_year"
download-one-ocean = "flexlock-run -d configs/download_configs:ocean -s main"
download-one-waves = "flexlock-run -d configs/download_configs:waves -s main"

[tool.pixi.dependencies]
cfgrib = ">=0.9.15.1,<0.10"
xarray = ">=2026.4.0,<2027"
h5netcdf = ">=1.8.1,<2"
zarr = ">=3.2.1,<4"
dash = ">=4.1.0,<5"
tqdm = ">=4.67.1,<5"
requests = ">=2.32.3,<3"
pyarrow = ">=20.0.0,<21"
webdataset = ">=0.2.86,<0.3"
scipy = ">=1.14,<2"
fsspec = ">=2025.3.0,<2026"
aiohttp = ">=3.9,<4"
loguru = ">=0.7.3,<0.8"
omegaconf = ">=2.3.0,<3"
gitpython = ">=3.1.45,<4"
python-xxhash = ">=3.5.0,<4"
joblib = ">=1.5.2,<2"
pandas = ">=2.3.2,<3"
cloudpickle = ">=3.0.0,<4"
