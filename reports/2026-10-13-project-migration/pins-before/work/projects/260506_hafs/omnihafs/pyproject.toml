[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@ifremer.fr"}]
dependencies = []
name = "sample_project"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[tool.pixi.system-requirements]
cuda = '12'

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
sample_project = { path = ".", editable = true }
# flexlock = { path = '../../2509_flexlock/flexlock_dev', editable = true }
flexlock = { path = '../../2509_flexlock/flexlock', editable = true }


[tool.pixi.dependencies]
python = "3.11.*"
gitpython = ">=3.1.45,<4"
python-xxhash = ">=3.5.0,<4"
joblib = ">=1.5.2,<2"
pandas = ">=2.3.2,<3"
omegaconf = ">=2.3.0,<3"
loguru = ">=0.7.0,<1"
cloudpickle = ">=3.0.0,<4"
cuda-version = "12.*"
xarray = ">=2026.4.0,<2027"
h5netcdf = ">=1.8.1,<2"
einops = ">=0.8.2,<0.9"
pytorch-gpu = ">=2.10.0,<3"
scipy = ">=1.17.1,<2"
numpy = ">=2.4.3,<3"
matplotlib = ">=3.10.9,<4"
zarr = ">=3.0,<4"
netcdf4 = ">=1.7.2,<2"
xrft = ">=1.0.2,<2"
dask = ">=2026.3.0,<2027"
pyresample = ">=1.35.0,<2"
webdataset = ">=1.0.2,<2"
lightning = ">=2.6.1,<3"

[tool.pixi.tasks]
