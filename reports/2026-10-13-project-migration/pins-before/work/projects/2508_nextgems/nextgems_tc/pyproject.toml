[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@imt-atlantique.fr"}]
dependencies = ["copernicusmarine>=2.2.2,<3"]
name = "nextgems_tc"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "quentinf00"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12"

[tool.pixi.pypi-dependencies]
nextgems_tc = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
xarray = ">=2025.8.0,<2026"
zarr = ">=3.1.1,<4"
matplotlib = ">=3.10.5,<4"
hvplot = ">=0.12.0,<0.13"
bokeh = ">=3.7.3,<4"
healpy = ">=1.18.1,<2"
easygems = ">=0.0.18,<0.0.19"
ipykernel = ">=6.30.1,<7"
fastparquet = ">=2024.11.0,<2025"
tqdm = ">=4.67.1,<5"
geoviews = ">=1.14.1,<2"
cartopy = ">=0.25.0,<0.26"
shapely = ">=2.1.1,<3"
jupyter_bokeh = ">=4.0.5,<5"
datashader = ">=0.18.2,<0.19"
selenium = ">=4.35.0,<5"
huracanpy = ">=1.3.0,<2"
tabulate = ">=0.9.0,<0.10"
h5netcdf = ">=1.6.4,<2"
dask = ">=2025.7.0,<2026"
gsw = ">=3.6.21,<4"
pytorch-gpu = ">=2.12.1,<3"
flexlock = "==0.8.1"

