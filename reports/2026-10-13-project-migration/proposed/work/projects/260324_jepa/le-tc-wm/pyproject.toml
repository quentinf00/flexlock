[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@imt-atlantique.fr"}]
dependencies = []
name = "le-tc-wm"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/le_tc_wm"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12"

[tool.pixi.pypi-dependencies]
le_tc_wm = { path = ".", editable = true }
geo-jepa = { path = "../geo-jepa", editable = true }
flexlock = { path = "/ontap/user/qfebvre/flexlock-execution-validation/reports/2026-10-12-pandas-removal/flexlock-0.9.2-py3-none-any.whl" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
xarray = ">=2026.4.0,<2027"
zarr = ">=3.2.0,<4"
dask = ">=2026.3.0,<2027"
numpy = ">=1.26"
scipy = ">=1.13"
scikit-learn = ">=1.5"
pandas = ">=2.2"
pytorch-gpu = ">=2.3"
lightning = ">=2.3"
timm = ">=1.0"
einops = ">=0.8"
omegaconf = ">=2.3"
loguru = ">=0.7"
matplotlib = ">=3.9"
netcdf4 = ">=1.7"
h5py = ">=3.11"
pyarrow = ">=23.0.1,<24"
fastparquet = ">=2025.12.0,<2026"
cloudpickle = ">=3.0"
gitpython = ">=3.1"
python-xxhash = ">=3.4"
cuda-version = "12.*"
cuda-compat = "12.4.*"
cuda-compat-impl = "550.54.*"

[tool.pixi.feature.dev.dependencies]
ipykernel = ">=6"
ipython = "*"
lovely-tensors = ">=0.1"

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/cuda-compat"

[tool.pixi.environments]
default = ["dev"]
