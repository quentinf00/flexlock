[project]
name = "smokeproj"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smokeproj"]

[tool.pixi.workspace]
channels = ["conda-forge", "quentinf00"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
flexlock = { path = "/ontap/user/qfebvre/flexlock-execution-validation/reports/2026-10-12-pandas-removal/flexlock-0.9.2-py3-none-any.whl" }
smokeproj = { path = ".", editable = true }
# For development against a local flexlock checkout, comment the conda dep
# below and uncomment (deps must then be added by hand — flexlock declares
# them conda-side only):
# flexlock = { path = "../flexlock", editable = true }

[tool.pixi.dependencies]
python = "3.11.*"
numpy = "*"
xarray = "*"
zarr = "*"
h5netcdf = "*"
matplotlib = "*"
pyarrow = "*"
ipykernel = "*"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "*"

[tool.pixi.feature.gpu.dependencies]
pytorch-gpu = "*"
cuda-version = "12.*"

# deprecated spelling, but the platforms-table replacement isn't accepted
# by pixi 0.72 yet
[tool.pixi.feature.gpu.system-requirements]
cuda = "12"

[tool.pixi.feature.dev.dependencies]
ipython = "*"
pytest = "*"
ruff = "*"

[tool.pixi.environments]
default = ["dev"]
cpu = ["cpu", "dev"]
gpu = ["gpu", "dev"]

[tool.pixi.tasks]
test = "pytest tests/"
lint = "ruff check src tests scripts"
# SIF builds embed the locked env; project sources stay bound at runtime
# (see container/env.def and docs/workflow.md).
build-sif-gpu = "apptainer build --fakeroot env_gpu.sif container/env.def"
build-sif-cpu = "apptainer build --fakeroot --build-arg ENV=cpu env_cpu.sif container/env.def"
