[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sst_ml_mapping"
version = "0.1.0"
authors = [
    { name = "quentinf00", email = "your.email@example.com" }
]
description = "A new project created with cookiecutter"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["sst_ml_mapping"]

[tool.pixi.workspace]
channels = ["conda-forge" , "quentinf00"]
platforms = ["linux-64", {platform="linux-64", cuda="12"}]


[tool.pixi.tasks]
start = "python sst_ml_mapping/main.py"


[tool.pixi.pypi-dependencies]
sst_ml_mapping = { path = ".", editable = true }
flexlock = { path = "/ontap/user/qfebvre/flexlock-execution-validation/reports/2026-10-12-pandas-removal/flexlock-0.9.2-py3-none-any.whl" }
# Absolute path (worktree-safe): async patch-materialize dataloading library.
# zarrpatch declares no runtime deps of its own, so h5py/kerchunk/fsspec below
# cover the pool I/O (hdf5) and virtualzarr (kerchunk cells B/D) paths.
zarrpatch = { path = "/scale/user/qfebvre/projects/260718_fastzarrloading/zarrpatch", editable = true }

[tool.pixi.feature.dev.dependencies]
lovely-tensors = "*" 
mlflow = "*" 
lovely-numpy = "*"
ipython = "*"
ipykernel = ">=7.1.0,<8"
pytest = ">=8,<9"

[tool.pixi.feature.dev.pypi-dependencies]
better_exceptions = "*"

[tool.pixi.dependencies]
python = "3.11.*"
# flexlock requires pandas <3; keep conda solve from pinning pandas 3.x
pandas = ">=2.3,<3"
# zarrpatch requires numpy >=2.4.6; keep conda solve from pinning an older numpy
numpy = ">=2.4.6,<3"
# flexlock = "*"
xarray = "*"
netcdf4 = "*"
scipy = "*"
matplotlib = "*"
loguru = "*" 
dask = ">=2025.12.0,<2026"
lightning = ">=2.6.0,<3"
h5netcdf = ">=1.7.3,<2"
zarr = ">=3.1.5,<4"
h5py = ">=3.11,<4"
kerchunk = ">=0.2.10,<0.3"
fsspec = "*"
kornia = ">=0.8.2,<0.9"
einops = ">=0.8.1,<0.9"
cartopy = ">=0.25.0,<0.26"
datashader = ">=0.18.2,<0.19"
diffusers = ">=0.35.2,<0.36"

[tool.pixi.feature.gpu-compat.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/cuda-compat"


[tool.pixi.feature.torch-gpu]
platforms = ["linux-64-cuda-12"]

[tool.pixi.feature.torch-gpu.dependencies]
cuda-version = "12.*"
pytorch-gpu = "2.*"

[tool.pixi.feature.gpu-compat.dependencies]
cuda-compat="12.4.*"
cuda-compat-impl="550.54.*"


[tool.pixi.feature.torch-cpu.dependencies]
pytorch-cpu = "2.*"




[tool.pixi.activation.env]
DO_NOT_TRACK = "true"
BETTER_EXCEPTIONS = "1"
LOVELY_TENSORS = "1"
MLFLOW_TRACKING_URI = "./mlruns"
MLFLOW_EXPERIMENT_NAME = "SST ML Mapping" 


[tool.pixi.environments]
default = ["dev", "gpu-compat", "torch-gpu"]
container = []

gpu = ["dev", "torch-gpu" ]
cpu = ["dev", "torch-cpu" ]

