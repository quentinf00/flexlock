loguru = ">=0.7.3,<0.8"
joblib = ">=1.5.2,<2"
lovely-tensors = ">=0.1.19,<0.2"
cloudpickle ="*"

[tool.pixi.feature.container.dependencies]

[tool.pixi.tasks]

[tool.pixi.dependencies]
python="3.13.*"
mlflow = ">=3.2.0,<4"
submitit = ">=1.5.2,<2"
xarray = ">=2025.9.0,<2026"
dask = "2025.7.*"
