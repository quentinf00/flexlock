[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@imt-atlantique.fr"}]
dependencies = ["lovely-numpy>=0.2.16,<0.3", "pytest-mock>=3.15.1,<4"]
name = "maxss-ml"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build]
sources = ["src"]

# [tool.hatch.build.targets.wheel]
# packages = ["src/maxss_data", "src/maxss_diff", "src/maxss_ml"]

[tool.pixi.feature.dev.activation.env]
LOVELY_TENSORS = "1"
BETTER_EXCEPTIONS = "1"

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/cuda-compat"
MLFLOW_DISABLE_TELEMETRY = "true"
HDF5_USE_FILE_LOCKING = "FALSE"

[tool.pixi.workspace]
channels = ["conda-forge", "quentinf00"]
platforms = [{ platform = "linux-64", cuda = "13" }]


[tool.pixi.pypi-dependencies]
maxss-ml = { path = ".", editable = true }
tcwind_benchtools = { path = "/ontap/user/qfebvre/work/projects/250930_maxss_era5pp/tcwind_benchtools", editable = true }
zarrpatch = { path = "/ontap/user/qfebvre/work/projects/260718_fastzarrloading/zarrpatch", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
flexlock = { path = "/ontap/user/qfebvre/flexlock-execution-validation/reports/2026-10-12-pandas-removal/flexlock-0.9.2-py3-none-any.whl" }

[tool.pixi.feature.dev.dependencies]
omegaconf = ">=2.3.0,<3"
