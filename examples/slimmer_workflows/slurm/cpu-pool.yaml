# Eight bounded queue workers, not one job per manifest item.
startup_lines:
  - '#SBATCH --partition=cpu'
  - '#SBATCH --array=0-7'
  - '#SBATCH --cpus-per-task=1'
  - '#SBATCH --mem=4G'
  - '#SBATCH --time=01:00:00'
  - 'cd /shared/checkouts/myproject-pinned'
python_exe: /shared/envs/myproject/bin/python
