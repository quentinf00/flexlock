[project]
name = "flexlock"
dynamic = ["version"]
authors = [ {name="Quentin Febvre", email="quentin.febvre@gmail.com"} ]
description = "A lightweight and painless SciOps library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "gitpython>=3.1.46,<4",
    "xxhash>=3.5.0,<4",
    "joblib>=1.5.2,<2",
    "pandas>=2.3.0,<3",
    "omegaconf>=2.3.0,<3",
    "loguru>=0.7.3,<0.8",
    "cloudpickle>=3.0.0,<4",
]

[project.scripts]
flexlock = "flexlock.cli:main"
flexlock-export = "flexlock.export:main"
flexlock-diff = "flexlock.diff_cli:main"
flexlock-run = "flexlock.run_cli:main"
flexlock-status = "flexlock.status_cli:main"
flexlock-worker = "flexlock.worker_cli:main"

[tool.pixi.package]
name = "flexlock"
version = "0.9.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.version]
path = "flexlock/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = ["flexlock"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]


[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["conda-forge"]

[tool.pixi.package.host-dependencies]
hatchling = "*"

# Runtime deps are declared once in [project.dependencies] (PyPI names) and
# mapped to conda-forge automatically by the build backend (see build.config
# below). Only python itself, which is not a PyPI project dependency, is pinned.
[tool.pixi.package.run-dependencies]
python = "3.11.*"

[tool.pixi.package.build.config]
# Map [project.dependencies] -> conda run-deps via the prefix.dev mapping service.
ignore-pypi-mapping = false

[tool.pixi.tasks]
test = { cmd = "pytest" }

[tool.pixi.feature.docs.dependencies]
sphinx = "*"
myst-parser = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinx_rtd_theme = "*"

[tool.pixi.feature.build.dependencies]
flexlock = {path = "."}

[tool.pixi.feature.build.pypi-dependencies]
build = "*"
twine = "*"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.3.2,<9"
pytest-mock = ">=3.14.0,<4"
ipython = "*"

[tool.pixi.feature.test.pypi-dependencies]
flexlock = { path = ".", editable = true }

[tool.pixi.feature.mlflow.dependencies]
mlflow = ">=3.2.0,<4"


# Workspace/dev env. pixi reads [project.dependencies] as pypi-dependencies of
# the default env, and the editable self-install (feature.test) pulls them too,
# so only the conda python interpreter is declared here.
[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.environments]
build = { features = ["build"] }
default = { features = ["test", "mlflow"] }
docs = { features = ["test", "docs"] }
